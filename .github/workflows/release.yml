name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Сборка RPM и публикация
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - name: Установка git и gh
        run: dnf -y install git gh && dnf clean all

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Доверие рабочему каталогу git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Зависимости сборки
        run: >
          dnf -y install
          cmake gcc-c++ make pkgconf-pkg-config
          qt6-qtbase-devel libusb1-devel
          rpm-build redhat-rpm-config tar gzip
          && dnf clean all

      - name: Сборка и тесты
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Сборка RPM
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Версия релиза: ${VERSION}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/ressetter-chip.spec
          mkdir -p "/opt/pkg/ressetter-chip-${VERSION}" /root/rpmbuild/SOURCES dist
          cp -r src tests packaging CMakeLists.txt README.md CHANGELOG.md LICENSE \
                "/opt/pkg/ressetter-chip-${VERSION}/"
          tar czf "/root/rpmbuild/SOURCES/ressetter-chip-${VERSION}.tar.gz" \
                -C /opt/pkg "ressetter-chip-${VERSION}"
          rpmbuild -ba packaging/ressetter-chip.spec
          cp /root/rpmbuild/RPMS/*/*.rpm dist/
          ls -l dist

      - name: Публикация релиза и вложение RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Ressetter Chip ${TAG}" \
              --notes "См. [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          fi
          gh release upload "$TAG" dist/*.rpm --clobber