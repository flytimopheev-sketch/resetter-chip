name: Предложение функции
description: Предложить новую возможность или улучшение
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею! Опишите задачу, а не только решение — так проще
        подобрать оптимальную реализацию.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает функция
      description: Что сейчас неудобно или невозможно сделать?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Интерфейс
        - Работа с чипом (чтение/запись)
        - Профили картриджей
        - Упаковка и установка
        - Документация
        - Другое
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Дополнительный контекст
      description: Ссылки, примеры, даташиты, фотографии